<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Open Chat Admin</title><link rel="stylesheet" href="styles.css"></head>
<body><main class="app-shell"><section class="name-panel"><h2>Access-code manager</h2><p class="subtitle">Create a code for each person who should be allowed into chat.</p>
<form id="admin-form"><label for="admin-pin">Admin PIN</label><input id="admin-pin" type="password" autocomplete="current-password" required><label for="new-code">New code <span>(optional; leave blank to generate one)</span></label><input id="new-code" maxlength="64" autocomplete="off"><label><input id="admin-code" type="checkbox"> Make this an admin code</label><div class="input-row"><button type="submit">Create access code</button><button id="refresh" class="secondary-button" type="button">Refresh list</button></div><p id="admin-error" class="error" role="alert"></p><p id="created-code" class="account-notice" hidden></p></form>
<h3>Whitelisted codes</h3><p class="subtitle">The actual code is shown only at creation time. Used means it has a profile attached.</p><ul id="code-list" class="online-users"></ul></section></main>
<script>
const $ = (s) => document.querySelector(s), error = $('#admin-error'), list = $('#code-list'), pin = $('#admin-pin');
function headers() { return { 'Content-Type': 'application/json', 'X-Admin-Pin': pin.value }; }
async function response(res) { const body = await res.json().catch(() => ({})); if (!res.ok) throw new Error(body.error || 'Request failed.'); return body; }
async function refresh() { error.textContent = ''; try { const data = await response(await fetch('/api/admin/access-codes', { headers: headers() })); list.replaceChildren(...data.codes.map(code => { const item = document.createElement('li'); item.className = 'status-online'; const label = document.createElement('span'); label.textContent = `${code.admin ? 'Admin' : 'Member'} code · ${code.used ? 'used' : 'unused'} · ${new Date(code.createdAt).toLocaleString()}`; const remove = document.createElement('button'); remove.className = 'danger-button'; remove.textContent = 'Revoke'; remove.onclick = async () => { if (!confirm('Revoke this access code? A device already signed in can remain connected until it leaves.')) return; try { await response(await fetch('/api/admin/access-codes/' + encodeURIComponent(code.id), { method: 'DELETE', headers: headers() })); refresh(); } catch (e) { error.textContent = e.message; } }; item.append(label, remove); return item; })); } catch (e) { error.textContent = e.message; } }
$('#admin-form').onsubmit = async (event) => { event.preventDefault(); error.textContent = ''; $('#created-code').hidden = true; try { const data = await response(await fetch('/api/admin/access-codes', { method: 'POST', headers: headers(), body: JSON.stringify({ code: $('#new-code').value, admin: $('#admin-code').checked }) })); $('#new-code').value = ''; $('#created-code').textContent = `New access code: ${data.code} — copy it now; it will not be shown in this list again.`; $('#created-code').hidden = false; refresh(); } catch (e) { error.textContent = e.message; } };
$('#refresh').onclick = refresh;
</script></body></html>
