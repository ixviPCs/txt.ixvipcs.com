<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Open Chat</title><link rel="stylesheet" href="styles.css"></head>
<body><main class="app-shell">
<section id="name-panel" class="name-panel"><h2 id="join-heading">Create profile</h2><form id="name-form"><div id="nickname-row"><label for="signup-nickname">Nickname <span>(optional)</span></label><input id="signup-nickname" maxlength="24" autocomplete="nickname"></div><label for="pin">Account PIN <span>(4–6 letters or numbers)</span></label><input id="pin" maxlength="6" autocomplete="new-password" required><div id="avatar-row"><label class="avatar-label" for="avatar">Profile picture <span>(optional)</span></label><input id="avatar" type="file" accept="image/png,image/jpeg,image/gif,image/webp"></div><div class="input-row"><button id="join-button" type="submit">Create account</button><button id="other-device" class="text-button" type="button">Join existing account</button></div><p id="name-error" class="error" role="alert"></p></form></section>
<section id="chat-panel" class="chat-panel" hidden><div class="chat-topbar"><div class="identity-block"><span id="identity"></span><img id="profile-avatar" class="topbar-avatar profile-trigger" alt="Your profile" hidden></div><div class="room-actions"><details class="online-users"><summary><span id="online-count">0 online</span></summary><ul id="online-list"></ul></details><button id="profile-button" class="text-button" type="button">Profile</button><a class="text-button voice-button" href="voice.html" target="_blank" rel="noopener">☎ Voice</a><button id="leave-chat" class="text-button leave-button" type="button">Leave chat</button></div></div><p id="account-notice" class="account-notice" hidden></p><ol id="messages" class="messages" aria-live="polite"></ol><form id="message-form" class="message-form"><input id="message" maxlength="1000" autocomplete="off" placeholder="Write a message…" disabled required><button id="send" type="submit" disabled>Send</button></form><p id="chat-error" class="error" role="alert"></p></section>
</main>
<dialog id="profile-dialog" class="confirm-dialog profile-dialog"><form id="profile-form"><h2 id="profile-title">Profile</h2><img id="dialog-avatar" class="dialog-avatar" alt="" hidden><label for="profile-name">Account name</label><input id="profile-name" maxlength="24" disabled><label for="profile-nickname">Nickname <span>(shown in chat)</span></label><input id="profile-nickname" maxlength="24"><label for="profile-bio">Bio</label><textarea id="profile-bio" maxlength="280"></textarea><label for="profile-pin">New PIN <span>(leave blank to keep it)</span></label><input id="profile-pin" maxlength="6"><div id="admin-controls" hidden><label for="ban-kind">Ban this person</label><div class="input-row"><select id="ban-kind"><option value="account">Account</option><option value="device">Device</option><option value="ip">IP address</option></select><select id="ban-duration"><option value="60">1 hour</option><option value="1440">1 day</option><option value="10080">1 week</option><option value="43200">30 days</option><option value="0">Permanent</option></select><button id="ban-button" class="danger-button" type="button">Ban</button></div><p class="subtitle">Admins can edit this account, including its permanent name.</p></div><p id="profile-error" class="error"></p><div class="dialog-actions"><button id="close-profile" type="button" class="secondary-button">Close</button><button type="submit">Save</button></div></form></dialog>
<dialog id="leave-dialog" class="confirm-dialog"><form method="dialog"><h2>Leave chat?</h2><p>You can reconnect from this device.</p><div class="dialog-actions"><button value="cancel" class="secondary-button">Cancel</button><button value="confirm" class="danger-button">Leave chat</button></div></form></dialog>
<script src="/socket.io/socket.io.js"></script><script src="app.js"></script></body></html>
